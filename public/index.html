<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#030508" />
    <meta
      name="description"
      content="SWEHUB — Centralized undergraduate SWE course material hub for IUT students. Lecture notes, books, previous year questions, and more."
    />
    <meta name="keywords" content="IUT, SWE, Software Engineering, course materials, lecture notes, books, previous year questions" />
    <meta name="author" content="IUT SWE Students" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>SWEHUB — IUT SWE Course Materials</title>
    <style>
      /* Global reset + dark theme base */
      * { margin: 0; padding: 0; outline: 0; box-sizing: border-box; }
      html, body, #root {
        height: 100%;
        font-family: 'Courier New', 'Lucida Console', monospace;
        background: #030508;
        color: #c8d8e8;
      }
      body { -webkit-font-smoothing: antialiased; }
      body, input, button, select, textarea {
        font: 13px 'Courier New', 'Lucida Console', monospace;
      }
      a { text-decoration: none; }
      ul { list-style: none; }
      button { cursor: pointer; }
      ::selection { background: rgba(0, 255, 136, 0.3); color: #fff; }
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0a0f14; }
      ::-webkit-scrollbar-thumb { background: #223344; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #334455; }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
